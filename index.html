<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Captura del valor del dólar</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 1rem 2.5rem rgb(24 39 75 / 10%);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.6rem;
      }

      p {
        color: #526078;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 1rem 0 0.4rem;
        font-weight: 650;
      }

      input,
      button {
        width: 100%;
        min-height: 3rem;
        border-radius: 0.6rem;
        font: inherit;
      }

      input {
        border: 1px solid #c8d0df;
        padding: 0.7rem 0.8rem;
      }

      input:focus {
        outline: 3px solid #c8dcff;
        border-color: #2864dc;
      }

      button {
        margin-top: 1.5rem;
        border: 0;
        padding: 0.7rem 1rem;
        color: #fff;
        background: #245cce;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
        font-weight: 600;
      }

      @media (max-width: 24rem) {
        main {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Valor del dólar</h1>
      <p>Selecciona la fecha completa y escribe el valor correspondiente.</p>

      <form id="capture-form" method="post" target="apps-script-response">
        <label for="date">Fecha (día, mes y año)</label>
        <input id="date" name="date" type="date" required>

        <label for="dollar-value">Valor del dólar</label>
        <input id="dollar-value" name="dollarValue" type="number" min="0.01" step="any" inputmode="decimal" required>

        <input id="request-id" name="requestId" type="hidden">
        <button id="submit-button" type="submit" disabled>Guardar registro</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Configura el enlace de Apps Script en el archivo index.html para activar el formulario.
      </p>
    </main>

    <iframe name="apps-script-response" title="Respuesta del servidor" hidden></iframe>

    <script>
      const SCRIPT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwaNF8aW_oycof9Ycq9HD6xrXHAAd66zea53U_CnMSxD-N1py7_EgFJa_ViSVP15lSb/exec';
      const form = document.getElementById('capture-form');
      const submitButton = document.getElementById('submit-button');
      const status = document.getElementById('status');
      const requestIdInput = document.getElementById('request-id');
      const configuredEndpoint = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(SCRIPT_ENDPOINT);
      let pendingRequestId = '';
      let requestTimeout;

      if (configuredEndpoint) {
        form.action = SCRIPT_ENDPOINT;
        submitButton.disabled = false;
        status.textContent = '';
      }

      form.addEventListener('submit', (event) => {
        if (!configuredEndpoint) {
          event.preventDefault();
          status.textContent = 'Primero configura la URL de implementación de Apps Script en el código.';
          return;
        }

        pendingRequestId = crypto.randomUUID();
        requestIdInput.value = pendingRequestId;
        submitButton.disabled = true;
        status.textContent = 'Enviando…';

        requestTimeout = window.setTimeout(() => {
          if (!pendingRequestId) {
            return;
          }

          pendingRequestId = '';
          submitButton.disabled = false;
          status.textContent = 'No llegó confirmación. Revisa la hoja antes de volver a enviar para evitar duplicados.';
        }, 20000);
      });

      window.addEventListener('message', (event) => {
        const isGoogleOrigin = event.origin === 'https://script.google.com' ||
          event.origin === 'https://script.googleusercontent.com' ||
          event.origin.endsWith('.googleusercontent.com');
        const result = event.data;

        if (!isGoogleOrigin || !result || result.source !== 'dollar-capture' ||
            result.requestId !== pendingRequestId) {
          return;
        }

        window.clearTimeout(requestTimeout);
        pendingRequestId = '';
        submitButton.disabled = false;
        status.textContent = result.message;

        if (result.success) {
          form.reset();
        }
      });
    </script>
  </body>
</html>
